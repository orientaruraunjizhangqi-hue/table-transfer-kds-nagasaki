<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>卓移動 — 長崎</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <style>
        /* ===== 長崎店専用: 生成り・白系 ミニマル伝票テーマ (WCAG AA 準拠) ===== */
        :root {
            --bg-main: #F3EFE6;        /* 生成りリネン */
            --bg-surface: #FFFFFF;     /* 伝票・モーダル白 */
            --bg-header: #FAF8F4;      /* ヘッダー・バー */
            --bg-sub: #EAE4D7;         /* セグメント・控えめな面 */
            --border-base: #D8D0C0;    /* 1px ヘアライン罫線 */
            --border-subtle: #EAE4D8;  /* 伝票内の細罫線 */
            --text-main: #221E1B;      /* 墨茶 (14.8:1) */
            --text-sub: #524A43;       /* 濃いウォームグレー (7.5:1) */
            --text-muted: #5E554D;     /* 補助ラベル (6.1:1) */
            --accent-dark: #26201D;    /* エスプレッソ黒茶 */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            letter-spacing: 0.01em;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
            -webkit-font-feature-settings: "tnum";
            font-feature-settings: "tnum";
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #C8BFAE; border-radius: 9999px; }

        /* ===== 古いSafari (CSS Grid 非対応) でも崩れないレイアウト ===== */
        .kds-grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -8px; }
        .kds-grid > * { width: calc(100% - 16px); margin: 8px; }
        @media (min-width: 768px)  { .kds-grid > * { width: calc(50% - 16px); } }
        @media (min-width: 1024px) { .kds-grid > * { width: calc(33.333% - 16px); } }
        @media (min-width: 1280px) { .kds-grid > * { width: calc(25% - 16px); } }

        /* 5列フロア配置グリッド (長崎店 6行×5列 / 全セル 44px 高) */
        .floor-grid {
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-flex-wrap: wrap; flex-wrap: wrap;
            margin: -3px;
        }
        .floor-cell {
            width: calc(20% - 6px);
            min-width: 44px;
            height: 44px;
            margin: 3px;
        }
        /* 通路・空マスは枠線や記号を描かず、自然な空間として抜く */
        .floor-empty {
            width: calc(20% - 6px);
            height: 44px;
            margin: 3px;
            pointer-events: none;
        }

        /* 区分・定型タグ折り返し (すべて最小 44x44px) */
        .chip-wrap {
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-flex-wrap: wrap; flex-wrap: wrap;
            margin: -3px;
        }
        .chip-btn {
            margin: 3px;
            min-height: 44px;
            min-width: 44px;
        }

        .two-col { display: -webkit-box; display: -webkit-flex; display: flex; }
        .two-col > * { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
        .two-col > * + * { margin-left: 6px; }

        /* タップ領域基準 (最小 44x44px / 主要操作 48px) */
        .tap-target {
            min-width: 44px;
            min-height: 44px;
        }
        .tap-primary {
            min-width: 48px;
            min-height: 48px;
        }

        /* flex の gap 非対応ブラウザ用 (iOS 14.0 以下) */
        .no-flexgap .flex.gap-1:not(.flex-col) > * + *   { margin-left: 0.25rem; }
        .no-flexgap .flex.gap-1\.5:not(.flex-col) > * + * { margin-left: 0.375rem; }
        .no-flexgap .flex.gap-2:not(.flex-col) > * + *   { margin-left: 0.5rem; }
        .no-flexgap .flex.gap-3:not(.flex-col) > * + *   { margin-left: 0.75rem; }
        .no-flexgap .flex.gap-5:not(.flex-col) > * + *   { margin-left: 1.25rem; }
        .no-flexgap .flex-col.gap-2 > * + *, .no-flexgap .flex-col.gap-3 > * + * { margin-top: 0.5rem; }
        @media (min-width: 640px) {
            .no-flexgap .flex-col.sm\:flex-row.gap-2 > * + * { margin-top: 0; margin-left: 0.5rem; }
            .no-flexgap .flex-col.sm\:flex-row.gap-3 > * + * { margin-top: 0; margin-left: 0.75rem; }
            .no-flexgap .flex-col.sm\:flex-row.gap-5 > * + * { margin-top: 0; margin-left: 1.25rem; }
        }

        /* 卓エリア別の控えめで上品なプレート色 (WCAG AA 8.5:1 以上) */
        .tbl-area-a   { background-color: #F6F1EA; border-color: #C7B299; color: #4A3520; }
        .tbl-area-b   { background-color: #EFF3F0; border-color: #A3BCAE; color: #264234; }
        .tbl-area-s   { background-color: #F2F0F5; border-color: #B5ACC7; color: #3B314D; }
        .tbl-area-o   { background-color: #EFF3F6; border-color: #A3B5C4; color: #283B4C; }
        .tbl-area-v   { background-color: #F7F1E8; border-color: #C29F70; color: #523716; }
        .tbl-area-sub { background-color: #F2EFE9; border-color: #BFB7AC; color: #423C36; }

        /* フロアマップ選択状態 (シャープなソリッド反転で一目で判別) */
        .selected-from {
            background-color: #26201D !important;
            border-color: #26201D !important;
            color: #FAF8F4 !important;
        }
        .selected-to {
            background-color: #2B4C3B !important;
            border-color: #2B4C3B !important;
            color: #FAF8F4 !important;
        }

        #bootError { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col h-screen overflow-hidden select-none">

    <!-- Header Navigation: 装飾アイコン・英語ピルを排したフラットな業務バー -->
    <header style="background-color: #FAF8F4; border-bottom: 1px solid #D8D0C0;" class="px-5 py-2 flex-none flex flex-wrap items-center justify-between gap-3 z-20">
        <div class="flex items-baseline space-x-3">
            <h1 style="color: #221E1B;" class="font-bold text-base tracking-tight">卓移動</h1>
            <span aria-hidden="true" style="color: #C8BFAE;">/</span>
            <span style="color: #524A43;" class="text-sm font-semibold">長崎</span>
            <span id="clock" style="color: #524A43;" class="tabular-nums font-mono text-xs font-medium pl-2">00:00:00</span>
            <span id="syncStatus" class="inline-flex items-center text-xs font-medium pl-1" title="端末間同期の状態">
                <span id="syncDot" class="w-1.5 h-1.5 rounded-full mr-1.5" style="background-color: #7A7067;"></span>
                <span id="syncText" style="color: #524A43;">接続中</span>
            </span>
        </div>

        <!-- Segmented Switcher -->
        <div role="tablist" aria-label="表示切り替え" style="background-color: #EAE4D7;" class="flex items-center p-0.5 rounded-md">
            <button type="button" role="tab" onclick="switchMainTab('ACTIVE')" id="tabBtnActive" style="background-color: #FFFFFF; color: #221E1B;" class="tap-target px-4 rounded text-xs sm:text-sm font-bold flex items-center justify-center gap-2">
                <span>移動待ち</span>
                <span id="activeBadge" class="tabular-nums font-mono text-xs font-bold">0</span>
            </button>
            <button type="button" role="tab" onclick="switchMainTab('COMPLETED')" id="tabBtnCompleted" style="background-color: transparent; color: #524A43;" class="tap-target px-4 rounded text-xs sm:text-sm font-semibold flex items-center justify-center gap-2">
                <span>完了履歴</span>
                <span id="completedBadge" class="tabular-nums font-mono text-xs font-semibold">0</span>
            </button>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center space-x-2">
            <button type="button" onclick="openTableMgmtModal()" style="background-color: transparent; border: 1px solid #CFC6B4; color: #221E1B;" class="tap-target px-3.5 hover:bg-stone-200 rounded-md text-xs sm:text-sm font-semibold transition-colors flex items-center justify-center">
                卓設定
            </button>

            <button type="button" id="soundToggleBtn" onclick="toggleSound()" aria-label="通知音の切り替え" style="background-color: transparent; border: 1px solid #CFC6B4; color: #221E1B;" class="tap-target w-11 h-11 hover:bg-stone-200 rounded-md transition-colors flex items-center justify-center" title="通知音切替">
                <i data-lucide="volume-2" id="soundIcon" style="color: #221E1B;" class="w-4 h-4"></i>
            </button>

            <button type="button" onclick="openOrderModal()" style="background-color: #26201D; color: #FAF8F4;" class="tap-target px-4 hover:opacity-90 rounded-md font-bold text-xs sm:text-sm transition-opacity flex items-center justify-center">
                オーダー発行
            </button>
        </div>
    </header>

    <div id="bootError" role="alert" class="bg-red-800 text-white text-xs px-4 py-2"></div>

    <!-- Main Board -->
    <main class="flex-1 p-5 overflow-y-auto relative" style="-webkit-overflow-scrolling: touch;">

        <!-- Active Board -->
        <div id="viewActive">
            <div id="activeGrid" class="kds-grid pb-10"></div>

            <!-- Quiet Minimal Empty State (箱・大アイコン・説明文なし) -->
            <div id="emptyActive" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
                <p style="color: #5E554D;" class="text-sm font-medium tracking-wide">移動待ちの伝票はありません</p>
            </div>
        </div>

        <!-- Completed Ledger View (カード乱立をやめ、1枚の台帳リストで整然と表示) -->
        <div id="viewCompleted" class="hidden max-w-4xl mx-auto pb-12">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                <div class="flex items-baseline space-x-2">
                    <h2 style="color: #221E1B;" class="text-sm font-bold">完了履歴</h2>
                    <span style="color: #524A43;" class="text-xs font-medium tabular-nums"><span id="completedTodayCount">0</span>件</span>
                </div>

                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" style="color: #5E554D;" class="w-4 h-4 absolute left-3 top-3.5 pointer-events-none"></i>
                    <input type="text" id="completedSearchInput" aria-label="完了履歴を検索" oninput="renderCompletedOrders()" placeholder="卓番・区分・メモで検索" style="background-color: #FFFFFF; border: 1px solid #CFC6B4; color: #221E1B;" class="tap-target w-full rounded-md pl-9 pr-3 text-xs sm:text-sm outline-none">
                </div>
            </div>

            <div id="completedList" style="background-color: #FFFFFF; border: 1px solid #D8D0C0;" class="rounded-md divide-y divide-stone-200 overflow-hidden">
            </div>

            <div id="emptyCompleted" style="color: #5E554D;" class="hidden text-center py-16">
                <p class="text-sm font-medium">完了した履歴はありません</p>
            </div>
        </div>
    </main>

    <!-- Table Management Modal -->
    <div id="tableMgmtModal" role="dialog" aria-modal="true" aria-labelledby="tableMgmtTitle" style="background-color: rgba(34, 30, 27, 0.45);" class="fixed inset-0 flex items-center justify-center p-4 z-50 hidden">
        <div style="background-color: #FAF8F4; border: 1px solid #CFC6B4;" class="rounded-md max-w-xl w-full p-5 space-y-4 shadow-lg">
            <div style="border-bottom: 1px solid #E2DBD0;" class="flex items-center justify-between pb-2.5">
                <h2 id="tableMgmtTitle" style="color: #221E1B;" class="font-bold text-base">卓設定</h2>
                <button type="button" onclick="closeTableMgmtModal()" aria-label="卓設定を閉じる" style="color: #524A43;" class="tap-target w-11 h-11 rounded-md hover:bg-stone-200 flex items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div>
                <label for="modalAddTableInput" style="color: #524A43;" class="block text-xs font-semibold mb-1.5">卓を追加</label>
                <div class="flex gap-2">
                    <input type="text" id="modalAddTableInput" aria-label="追加する卓番号" placeholder="例: A2, V6" style="background-color: #FFFFFF; border: 1px solid #CFC6B4; color: #221E1B;" class="tap-target flex-1 rounded-md px-3 text-sm outline-none">
                    <button type="button" onclick="handleAddTableFromMgmt()" style="background-color: #26201D; color: #FAF8F4;" class="tap-target px-5 font-bold text-xs sm:text-sm rounded-md flex items-center justify-center">
                        追加
                    </button>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <span style="color: #524A43;" class="text-xs font-semibold">登録卓一覧</span>
                    <button type="button" onclick="resetDefaultTables()" style="background-color: #FFFFFF; color: #524A43; border: 1px solid #CFC6B4;" class="tap-target px-3 rounded-md text-xs font-semibold hover:bg-stone-200 flex items-center justify-center">
                        初期の24卓に戻す
                    </button>
                </div>
                <div id="mgmtTablesGrid" style="background-color: #FFFFFF; border: 1px solid #D8D0C0; -webkit-overflow-scrolling: touch;" class="divide-y divide-stone-200 max-h-72 overflow-y-auto rounded-md">
                </div>
            </div>

            <div style="border-top: 1px solid #E2DBD0;" class="pt-3 flex justify-end">
                <button type="button" onclick="closeTableMgmtModal()" style="background-color: #EAE4D7; color: #221E1B;" class="tap-target px-6 rounded-md text-xs sm:text-sm font-bold flex items-center justify-center">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- Order Modal: 番号・英語・入れ子ボックスを削ぎ落としたフラット構造 -->
    <div id="orderModal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle" style="background-color: rgba(34, 30, 27, 0.45);" class="fixed inset-0 flex items-center justify-center p-2 sm:p-3 z-50 hidden">
        <div style="background-color: #FAF8F4; border: 1px solid #CFC6B4;" class="rounded-md max-w-4xl w-full max-h-[97vh] flex flex-col shadow-lg overflow-hidden">

            <div style="border-bottom: 1px solid #E2DBD0;" class="px-5 py-2 flex items-center justify-between">
                <h2 id="orderModalTitle" style="color: #221E1B;" class="font-bold text-base">卓移動オーダー</h2>
                <button type="button" onclick="closeOrderModal()" aria-label="オーダー画面を閉じる" style="color: #524A43;" class="tap-target w-11 h-11 -mr-2 rounded-md hover:bg-stone-200 flex items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-5 py-3 space-y-3" style="-webkit-overflow-scrolling: touch;">

                <!-- 上段: 対象 ＆ 区分 -->
                <div class="flex flex-col sm:flex-row gap-5 items-stretch sm:items-start">
                    <div class="sm:w-44 flex-none">
                        <div style="color: #524A43;" class="text-xs font-semibold mb-1">対象</div>
                        <div class="two-col">
                            <button type="button" onclick="selectGender('男性')" id="genderBtnMale" class="tap-target px-3 rounded border font-bold text-xs sm:text-sm flex items-center justify-center transition-colors">
                                男性
                            </button>
                            <button type="button" onclick="selectGender('女性')" id="genderBtnFemale" class="tap-target px-3 rounded border font-bold text-xs sm:text-sm flex items-center justify-center transition-colors">
                                女性
                            </button>
                        </div>
                    </div>

                    <div class="flex-1 min-w-0">
                        <div style="color: #524A43;" class="text-xs font-semibold mb-1">区分</div>
                        <div id="moveTypeButtons" class="chip-wrap"></div>
                    </div>
                </div>

                <!-- 中段: フロア配置 (箱で囲わず 1px 罫線だけで左右分割) -->
                <div style="border-top: 1px solid #E2DBD0; border-bottom: 1px solid #E2DBD0;" class="py-3 flex flex-col sm:flex-row gap-5">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-baseline justify-between mb-1.5">
                            <span style="color: #524A43;" class="text-xs font-semibold">移動元</span>
                            <span id="fromSelectedBadge" style="color: #221E1B;" class="tabular-nums text-sm font-black tracking-wide">A1</span>
                        </div>
                        <div id="fromTableButtons" class="floor-grid"></div>
                    </div>

                    <div aria-hidden="true" class="hidden sm:block" style="width: 1px; background-color: #E2DBD0;"></div>

                    <div class="flex-1 min-w-0">
                        <div class="flex items-baseline justify-between mb-1.5">
                            <span style="color: #524A43;" class="text-xs font-semibold">移動先</span>
                            <span id="toSelectedBadge" style="color: #264234;" class="tabular-nums text-sm font-black tracking-wide">B1</span>
                        </div>
                        <div id="toTableButtons" class="floor-grid"></div>
                    </div>
                </div>

                <!-- 下段: 引き継ぎ ＆ 補足メモ (外箱・説明文なし) -->
                <div class="flex flex-col sm:flex-row gap-5 items-stretch sm:items-end">
                    <div class="flex-1 min-w-0">
                        <div style="color: #524A43;" class="text-xs font-semibold mb-1">引き継ぎ</div>
                        <div id="quickTagButtons" class="chip-wrap"></div>
                    </div>

                    <div class="sm:w-64 flex-none">
                        <label for="textNoteInput" style="color: #524A43;" class="block text-xs font-semibold mb-1">メモ</label>
                        <input type="text" id="textNoteInput" aria-label="補足メモ" placeholder="任意入力" style="background-color: #FFFFFF; border: 1px solid #CFC6B4; color: #221E1B;" class="tap-target w-full rounded px-3 text-xs sm:text-sm outline-none">
                    </div>
                </div>

            </div>

            <div style="border-top: 1px solid #E2DBD0; background-color: #F3EFE6;" class="px-5 py-2.5 flex items-center justify-end space-x-2.5">
                <button type="button" onclick="closeOrderModal()" style="background-color: #FFFFFF; border: 1px solid #CFC6B4; color: #221E1B;" class="tap-primary px-5 rounded text-xs sm:text-sm font-semibold transition-colors flex items-center justify-center">
                    キャンセル
                </button>
                <button type="button" onclick="submitTransferOrder()" style="background-color: #26201D; color: #FAF8F4;" class="tap-primary flex-1 sm:flex-none px-8 rounded text-sm font-bold transition-opacity hover:opacity-90 flex items-center justify-center">
                    発行する
                </button>
            </div>

        </div>
    </div>

    <!-- Minimal Single-Line Toast -->
    <div id="toast" role="status" aria-live="polite" style="background-color: #221E1B; color: #FAF8F4;" class="fixed bottom-5 right-5 px-4 py-2.5 rounded-md shadow-md flex items-center space-x-2 text-xs transform translate-y-20 opacity-0 transition-all duration-200 z-50 pointer-events-none">
        <span id="toastTitle" class="font-bold"></span>
        <span aria-hidden="true" style="color: #7A7067;">·</span>
        <span id="toastMsg" style="color: #EAE4D7;"></span>
    </div>

    <script>
        window.onerror = function (msg, src, line) {
            var el = document.getElementById('bootError');
            if (el) {
                el.style.display = 'block';
                el.textContent = 'エラー: ' + msg + ' (' + String(src || '').split('/').pop() + ':' + line + ')';
            }
        };
    </script>
    <script src="icons.js?v=4"></script>
    <script src="app.js?v=4"></script>
</body>
</html>
