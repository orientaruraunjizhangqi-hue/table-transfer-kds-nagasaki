<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>卓移動 KDS — 長崎</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <style>
        /* ===== 長崎店専用: 白・ベージュ系 クラシック・シックテーマ (WCAG AA 準拠) ===== */
        :root {
            --bg-main: #F5F2EB;        /* 暖かいリネンベージュ */
            --bg-surface: #FFFFFF;     /* カード・モーダル白 */
            --bg-sub: #EDE8DF;         /* サブ背景（サンドベージュ） */
            --border-base: #D5CBB8;    /* 上品なグレージュ枠線 */
            --border-strong: #BCAE99;
            --text-main: #26201D;      /* ディープチャコールブラウン (13.8:1) */
            --text-sub: #524942;       /* ウォームダークグレー (7.3:1 >= AA) */
            --text-muted: #5C534B;     /* 補助テキスト (6.2:1 >= AA) */
            --accent-dark: #3A322D;    /* エスプレッソ（主要ボタン） */
            --accent-bronze: #705330;  /* アンティークブロンズ (AA対応) */
            --accent-sage: #3B5949;    /* セージグリーン（完了・稼働 AA対応） */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
            letter-spacing: 0.02em;
            touch-action: manipulation;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #EDE8DF; }
        ::-webkit-scrollbar-thumb { background: #C4B9A5; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #A89B84; }

        @-webkit-keyframes pulse-terracotta {
            0%, 100% { border-color: rgba(158, 51, 40, 0.9); box-shadow: 0 4px 16px rgba(158, 51, 40, 0.18); }
            50% { border-color: rgba(158, 51, 40, 0.28); box-shadow: 0 2px 6px rgba(158, 51, 40, 0.06); }
        }
        @keyframes pulse-terracotta {
            0%, 100% { border-color: rgba(158, 51, 40, 0.9); box-shadow: 0 4px 16px rgba(158, 51, 40, 0.18); }
            50% { border-color: rgba(158, 51, 40, 0.28); box-shadow: 0 2px 6px rgba(158, 51, 40, 0.06); }
        }
        .urgency-danger { -webkit-animation: pulse-terracotta 2s infinite; animation: pulse-terracotta 2s infinite; }

        /* ===== 古いSafari (CSS Grid 非対応) でも崩れないレイアウト ===== */
        .kds-grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -8px; }
        .kds-grid > * { width: calc(100% - 16px); margin: 8px; }
        @media (min-width: 768px)  { .kds-grid > * { width: calc(50% - 16px); } }
        @media (min-width: 1024px) { .kds-grid > * { width: calc(33.333% - 16px); } }
        @media (min-width: 1280px) { .kds-grid > * { width: calc(25% - 16px); } }

        /* 5列フロアマップグリッド (長崎店 6行×5列 / 全セル高さ 44px タップ基準準拠) */
        .floor-grid {
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-flex-wrap: wrap; flex-wrap: wrap;
            margin: -3px;
        }
        .floor-cell {
            width: calc(20% - 6px);
            min-width: 44px;
            height: 44px;
            margin: 3px;
        }
        .floor-empty {
            width: calc(20% - 6px);
            height: 44px;
            margin: 3px;
            border-radius: 8px;
            border: 1px dashed #D8D0C2;
            background-color: rgba(237, 232, 223, 0.4);
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-box-align: center; -webkit-align-items: center; align-items: center;
            -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
            color: #BFB4A3;
            font-size: 12px;
        }

        /* 移動区分ボタン / 定型文タグ グリッド (すべて最小 44x44px) */
        .chip-wrap {
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-flex-wrap: wrap; flex-wrap: wrap;
            margin: -3px;
        }
        .chip-btn {
            margin: 3px;
            min-height: 44px;
            min-width: 44px;
        }

        .two-col { display: -webkit-box; display: -webkit-flex; display: flex; }
        .two-col > * { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
        .two-col > * + * { margin-left: 8px; }

        /* iPad タップターゲット共通クラス (最小 44x44px / 主要ボタン 48px) */
        .tap-target {
            min-width: 44px;
            min-height: 44px;
        }
        .tap-primary {
            min-width: 48px;
            min-height: 48px;
        }

        /* flex の gap 非対応ブラウザ用 (iOS 14.0 以下) */
        .no-flexgap .flex.gap-1:not(.flex-col) > * + *   { margin-left: 0.25rem; }
        .no-flexgap .flex.gap-1\.5:not(.flex-col) > * + * { margin-left: 0.375rem; }
        .no-flexgap .flex.gap-2:not(.flex-col) > * + *   { margin-left: 0.5rem; }
        .no-flexgap .flex.gap-3:not(.flex-col) > * + *   { margin-left: 0.75rem; }
        .no-flexgap .flex-col.gap-2 > * + *, .no-flexgap .flex-col.gap-3 > * + * { margin-top: 0.5rem; }
        @media (min-width: 640px) {
            .no-flexgap .flex-col.sm\:flex-row.gap-2 > * + * { margin-top: 0; margin-left: 0.5rem; }
            .no-flexgap .flex-col.sm\:flex-row.gap-3 > * + * { margin-top: 0; margin-left: 0.75rem; }
        }

        /* 卓エリア別の上品なカラープリセット (すべて WCAG AA コントラスト 5.5:1 以上) */
        .tbl-area-a   { background-color: #F6F1EA; border-color: #C2A88B; color: #4F3A24; } /* A卓: ウォームキャメル */
        .tbl-area-b   { background-color: #EFF3F0; border-color: #9BB5A7; color: #2B4739; } /* B卓: セージグリーン */
        .tbl-area-s   { background-color: #F2F0F5; border-color: #B0A7C2; color: #3F3552; } /* S卓: モーヴグレー */
        .tbl-area-o   { background-color: #EFF3F6; border-color: #9EB1C2; color: #2D4052; } /* O卓: スレートブルー */
        .tbl-area-v   { background-color: #F7F1EB; border-color: #BA9361; color: #593D1A; } /* V卓(VIP): シャンパンゴールド */
        .tbl-area-sub { background-color: #F2EFE9; border-color: #BFB7AC; color: #4A433D; } /* その他: ストーングレー */

        /* 選択時の強調 */
        .selected-from {
            box-shadow: 0 0 0 2px #705330, 0 2px 6px rgba(58, 50, 45, 0.2);
            border-color: #705330 !important;
            background-color: #EADCCB !important;
            color: #26201D !important;
        }
        .selected-to {
            box-shadow: 0 0 0 2px #3B5949, 0 2px 6px rgba(42, 74, 58, 0.2);
            border-color: #3B5949 !important;
            background-color: #DCEAE2 !important;
            color: #1A3326 !important;
        }

        /* 起動エラー表示 */
        #bootError { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col h-screen overflow-hidden select-none">

    <!-- Header Navigation -->
    <header style="background-color: #FDFBF7; border-bottom: 1px solid #D5CBB8;" class="px-5 py-2.5 flex-none flex flex-wrap items-center justify-between gap-2 shadow-sm z-20">
        <!-- Brand & Clock -->
        <div class="flex items-center space-x-3">
            <div style="background-color: #3A322D; color: #F5F2EB;" class="w-10 h-10 rounded-lg flex items-center justify-center shadow-sm">
                <i data-lucide="arrow-right-left" class="w-5 h-5"></i>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 style="color: #26201D;" class="font-bold text-base sm:text-lg tracking-wider">卓移動 KDS</h1>
                    <span style="background-color: #EDE8DF; color: #4F3A24; border: 1px solid #CBBFA9;" class="text-[11px] font-bold px-2.5 py-0.5 rounded tracking-widest">NAGASAKI / 長崎</span>
                </div>
                <div class="flex items-center space-x-2 text-xs mt-0.5">
                    <span id="syncStatus" class="flex items-center font-semibold" title="端末間同期の状態">
                        <span id="syncDot" class="w-2 h-2 rounded-full mr-1.5" style="background-color: #6E655F;"></span>
                        <span id="syncText" style="color: #524942;">接続中…</span>
                    </span>
                    <span aria-hidden="true" style="color: #BCAE99;">•</span>
                    <span id="clock" style="color: #524942;" class="font-mono font-semibold">00:00:00</span>
                </div>
            </div>
        </div>

        <!-- View Switcher Tabs -->
        <div role="tablist" aria-label="表示切り替え" style="background-color: #EDE8DF; border: 1px solid #D5CBB8;" class="flex items-center p-1 rounded-xl">
            <button type="button" role="tab" onclick="switchMainTab('ACTIVE')" id="tabBtnActive" style="background-color: #3A322D; color: #FAF8F5;" class="tap-target px-4 rounded-lg text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5">
                <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
                <span>移動待ち</span>
                <span id="activeBadge" style="background-color: #FAF8F5; color: #26201D;" class="ml-1 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
            <button type="button" role="tab" onclick="switchMainTab('COMPLETED')" id="tabBtnCompleted" style="background-color: transparent; color: #524942;" class="tap-target px-4 rounded-lg text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                <span>完了履歴</span>
                <span id="completedBadge" style="background-color: #D8D0C2; color: #26201D;" class="ml-1 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center space-x-2">
            <button type="button" onclick="openTableMgmtModal()" aria-label="卓管理を開く" style="background-color: #FFFFFF; border: 1px solid #CBBFA9; color: #3A322D;" class="tap-target px-3.5 hover:bg-stone-100 rounded-lg text-xs sm:text-sm font-bold transition-colors flex items-center justify-center gap-1.5 shadow-sm" title="卓の設定・追加・削除">
                <i data-lucide="palette" style="color: #705330;" class="w-4 h-4"></i>
                <span>卓管理</span>
            </button>

            <button type="button" id="soundToggleBtn" onclick="toggleSound()" aria-label="通知音の切り替え" style="background-color: #FFFFFF; border: 1px solid #CBBFA9; color: #3A322D;" class="tap-target hover:bg-stone-100 rounded-lg transition-colors shadow-sm flex items-center justify-center" title="通知音切替">
                <i data-lucide="volume-2" id="soundIcon" style="color: #3B5949;" class="w-5 h-5"></i>
            </button>

            <button type="button" onclick="openOrderModal()" style="background-color: #3A322D; color: #FAF8F5;" class="tap-target flex items-center justify-center space-x-1.5 px-4 hover:opacity-90 rounded-lg font-bold text-xs sm:text-sm shadow-sm transition-all">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>移動オーダー発行</span>
            </button>
        </div>
    </header>

    <!-- 起動エラー -->
    <div id="bootError" role="alert" class="bg-red-800 text-white text-xs px-4 py-2"></div>

    <!-- Main Content Container -->
    <main class="flex-1 p-5 overflow-y-auto relative" style="-webkit-overflow-scrolling: touch;">

        <!-- View 1: Active KDS Board -->
        <div id="viewActive" class="space-y-4">
            <div id="activeGrid" class="kds-grid pb-12">
                <!-- Active order cards -->
            </div>

            <!-- Empty Active State -->
            <div id="emptyActive" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-6 pointer-events-none">
                <div style="background-color: #FDFBF7; border: 1px solid #D5CBB8;" class="p-8 rounded-2xl max-w-sm flex flex-col items-center shadow-sm">
                    <div style="background-color: #EDE8DF; color: #3B5949;" class="p-3.5 rounded-xl mb-3">
                        <i data-lucide="check-check" class="w-8 h-8"></i>
                    </div>
                    <h2 style="color: #26201D;" class="font-bold text-base mb-1">現在、移動待ちの伝票はありません</h2>
                    <p style="color: #524942;" class="text-xs leading-relaxed">右上の「移動オーダー発行」から新しい卓移動を登録できます。</p>
                </div>
            </div>
        </div>

        <!-- View 2: Completed Orders View -->
        <div id="viewCompleted" class="hidden space-y-4 max-w-5xl mx-auto pb-12">
            <div style="background-color: #FDFBF7; border: 1px solid #D5CBB8;" class="rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <div style="background-color: #EDE8DF; color: #3B5949;" class="p-2.5 rounded-lg">
                        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h2 style="color: #26201D;" class="text-sm font-bold">移動完了履歴</h2>
                        <p style="color: #524942;" class="text-xs font-medium">完了数: <span id="completedTodayCount" style="color: #2F5744;" class="font-bold">0</span> 件</p>
                    </div>
                </div>

                <div class="relative w-full sm:w-72">
                    <i data-lucide="search" style="color: #5C534B;" class="w-4 h-4 absolute left-3.5 top-3.5 pointer-events-none"></i>
                    <input type="text" id="completedSearchInput" aria-label="完了履歴を卓番号・区分・メモで検索" oninput="renderCompletedOrders()" placeholder="卓番号・区分・メモで検索..." style="background-color: #F5F2EB; border: 1px solid #CBBFA9; color: #26201D;" class="tap-target w-full rounded-lg pl-10 pr-3 text-xs sm:text-sm outline-none">
                </div>
            </div>

            <div id="completedList" class="space-y-2.5">
                <!-- Completed order items rendered here -->
            </div>

            <div id="emptyCompleted" style="color: #5C534B;" class="hidden text-center py-16">
                <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-70"></i>
                <p class="text-xs font-semibold">完了した移動伝票の履歴はありません</p>
            </div>
        </div>
    </main>

    <!-- Table Management Modal -->
    <div id="tableMgmtModal" role="dialog" aria-modal="true" aria-labelledby="tableMgmtTitle" style="background-color: rgba(38, 32, 29, 0.5);" class="fixed inset-0 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div style="background-color: #FDFBF7; border: 1px solid #D5CBB8;" class="rounded-xl max-w-xl w-full p-5 space-y-4 shadow-xl">
            <div style="border-bottom: 1px solid #E5DEC9;" class="flex items-center justify-between pb-2.5">
                <div class="flex items-center space-x-2">
                    <i data-lucide="palette" style="color: #705330;" class="w-5 h-5"></i>
                    <h2 id="tableMgmtTitle" style="color: #26201D;" class="font-bold text-base">卓管理（色分け・追加・削除）</h2>
                </div>
                <button type="button" onclick="closeTableMgmtModal()" aria-label="卓管理モーダルを閉じる" style="color: #524942;" class="tap-target rounded-lg hover:bg-stone-200 flex items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div>
                <label for="modalAddTableInput" style="color: #3A322D;" class="block text-xs font-bold mb-1.5">新しい卓番号を追加</label>
                <div class="flex gap-2">
                    <input type="text" id="modalAddTableInput" aria-label="追加する卓番号" placeholder="例: A2, V6" style="background-color: #FFFFFF; border: 1px solid #CBBFA9; color: #26201D;" class="tap-target flex-1 rounded-lg px-3.5 text-sm outline-none">
                    <button type="button" onclick="handleAddTableFromMgmt()" style="background-color: #3A322D; color: #FAF8F5;" class="tap-target px-5 font-bold text-xs sm:text-sm rounded-lg shadow-sm flex items-center justify-center gap-1.5">
                        <i data-lucide="plus" class="w-4 h-4"></i> 追加
                    </button>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <span style="color: #3A322D;" class="block text-xs font-bold">登録済みの卓一覧</span>
                    <button type="button" onclick="resetDefaultTables()" style="background-color: #F5F2EB; color: #593D1A; border: 1px solid #CBBFA9;" class="tap-target px-3 rounded-lg text-xs font-bold hover:bg-stone-200 flex items-center justify-center">
                        初期の24卓に戻す
                    </button>
                </div>
                <div id="mgmtTablesGrid" style="background-color: #F5F2EB; border: 1px solid #D5CBB8; -webkit-overflow-scrolling: touch;" class="space-y-2 max-h-72 overflow-y-auto p-2.5 rounded-lg">
                </div>
            </div>

            <div style="border-top: 1px solid #E5DEC9;" class="pt-3 flex justify-end">
                <button type="button" onclick="closeTableMgmtModal()" style="background-color: #EDE8DF; color: #26201D; border: 1px solid #CBBFA9;" class="tap-target px-6 rounded-lg text-xs sm:text-sm font-bold flex items-center justify-center">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- Transfer Order Entry Modal (iPad 1024x768 1画面収容 & 全ボタン 44x44px 以上) -->
    <div id="orderModal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle" style="background-color: rgba(38, 32, 29, 0.5);" class="fixed inset-0 backdrop-blur-sm flex items-center justify-center p-2 sm:p-3 z-50 hidden">
        <div style="background-color: #FDFBF7; border: 1px solid #D5CBB8;" class="rounded-xl max-w-4xl w-full max-h-[97vh] flex flex-col shadow-xl overflow-hidden">

            <div style="background-color: #F5F2EB; border-bottom: 1px solid #D5CBB8;" class="px-4 py-1.5 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i data-lucide="arrow-right-left" style="color: #705330;" class="w-4 h-4"></i>
                    <h2 id="orderModalTitle" style="color: #26201D;" class="font-bold text-sm sm:text-base">卓移動オーダー発行</h2>
                </div>
                <button type="button" onclick="closeOrderModal()" aria-label="オーダー発行モーダルを閉じる" style="color: #524942;" class="tap-target rounded-lg hover:bg-stone-200 flex items-center justify-center">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-4 py-2.5 space-y-2.5" style="-webkit-overflow-scrolling: touch;">

                <!-- 1. 性別 & 2. 移動区分 -->
                <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-start">
                    <!-- 性別 -->
                    <div class="sm:w-56 flex-none">
                        <label style="color: #3A322D;" class="block text-xs font-bold mb-1">
                            1. 対象（性別）
                        </label>
                        <div class="two-col">
                            <button type="button" onclick="selectGender('男性')" id="genderBtnMale" class="tap-target px-2.5 rounded-lg border font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all">
                                <span aria-hidden="true" class="w-2.5 h-2.5 rounded-full" style="background-color: #344E68;"></span>
                                <span>男性</span>
                            </button>
                            <button type="button" onclick="selectGender('女性')" id="genderBtnFemale" class="tap-target px-2.5 rounded-lg border font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all">
                                <span aria-hidden="true" class="w-2.5 h-2.5 rounded-full" style="background-color: #7D4449;"></span>
                                <span>女性</span>
                            </button>
                        </div>
                    </div>

                    <!-- 移動の区分 (7種が1行にすっきり並ぶ) -->
                    <div class="flex-1 min-w-0">
                        <label style="color: #3A322D;" class="block text-xs font-bold mb-1">
                            2. 移動の区分
                        </label>
                        <div id="moveTypeButtons" class="chip-wrap">
                            <!-- Move type buttons rendered dynamically -->
                        </div>
                    </div>
                </div>

                <!-- 3 & 4. From / To Table Floor Layout -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <!-- From Table -->
                    <div style="background-color: #F5F2EB; border: 1px solid #D5CBB8;" class="flex-1 min-w-0 p-2.5 rounded-lg">
                        <div class="text-xs font-bold mb-1.5 flex items-center justify-between" style="color: #3A322D;">
                            <span>3. 移動元 (FROM)</span>
                            <span id="fromSelectedBadge" style="background-color: #EADCCB; color: #3A2A18; border: 1px solid #B89B78;" class="px-2.5 py-0.5 rounded font-mono text-xs font-bold">未選択</span>
                        </div>
                        <div id="fromTableButtons" class="floor-grid">
                        </div>
                    </div>

                    <!-- To Table -->
                    <div style="background-color: #F5F2EB; border: 1px solid #D5CBB8;" class="flex-1 min-w-0 p-2.5 rounded-lg">
                        <div class="text-xs font-bold mb-1.5 flex items-center justify-between" style="color: #3A322D;">
                            <span>4. 移動先 (TO)</span>
                            <span id="toSelectedBadge" style="background-color: #DCEAE2; color: #1A3326; border: 1px solid #8FB09E;" class="px-2.5 py-0.5 rounded font-mono text-xs font-bold">未選択</span>
                        </div>
                        <div id="toTableButtons" class="floor-grid">
                        </div>
                    </div>
                </div>

                <!-- 5. ワンタップ定型タグ & 補足メモ (横並びで視線移動と高さを最適化) -->
                <div style="border: 1px solid #D5CBB8; background-color: #FFFFFF;" class="rounded-lg px-3 py-2">
                    <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <span style="color: #3A322D;" class="text-xs font-bold flex items-center gap-1.5">
                                    <i data-lucide="file-text" style="color: #705330;" class="w-3.5 h-3.5"></i> 5. 引き継ぎ・指示タグ（複数選択可）
                                </span>
                                <span style="color: #5C534B;" class="text-[11px] font-medium">タップでON/OFF</span>
                            </div>
                            <div id="quickTagButtons" class="chip-wrap">
                                <!-- Quick tag chips rendered dynamically -->
                            </div>
                        </div>

                        <div class="sm:w-64 flex-none">
                            <label for="textNoteInput" style="color: #3A322D;" class="block text-xs font-bold mb-1">補足メモ（任意）</label>
                            <input type="text" id="textNoteInput" aria-label="補足メモ（任意）" placeholder="例: ボトル・グラス移動" style="background-color: #FAF8F5; border: 1px solid #CBBFA9; color: #26201D;" class="tap-target w-full rounded-lg px-3 text-xs sm:text-sm outline-none">
                        </div>
                    </div>
                </div>

            </div>

            <div style="background-color: #F5F2EB; border-top: 1px solid #D5CBB8;" class="px-4 py-2 flex items-center justify-end space-x-3">
                <button type="button" onclick="closeOrderModal()" style="background-color: #FFFFFF; border: 1px solid #CBBFA9; color: #3A322D;" class="tap-primary px-5 rounded-lg text-xs sm:text-sm font-bold transition-colors flex items-center justify-center">
                    キャンセル
                </button>
                <button type="button" onclick="submitTransferOrder()" style="background-color: #3A322D; color: #FAF8F5;" class="tap-primary flex-1 sm:flex-none px-7 rounded-lg text-sm font-bold shadow-sm transition-all flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>移動指示を送信</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" role="status" aria-live="polite" style="background-color: #26201D; color: #FAF8F5; border: 1px solid #5C5049;" class="fixed bottom-5 right-5 px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 text-xs transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <div style="background-color: rgba(255,255,255,0.12); color: #E2C799;" class="p-1.5 rounded-lg">
            <i data-lucide="bell" class="w-4 h-4"></i>
        </div>
        <div>
            <div id="toastTitle" class="font-bold">通知</div>
            <div id="toastMsg" style="color: #E5DEC9;" class="text-[11px]">メッセージ本文</div>
        </div>
    </div>

    <script>
        window.onerror = function (msg, src, line) {
            var el = document.getElementById('bootError');
            if (el) {
                el.style.display = 'block';
                el.textContent = 'エラー: ' + msg + ' (' + String(src || '').split('/').pop() + ':' + line + ')';
            }
        };
    </script>
    <script src="icons.js?v=3"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
