<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>卓移動 KDS — 長崎</title>
    <link rel="stylesheet" href="styles.css?v=1">
    <style>
        /* ===== 長崎店専用: 白・ベージュ系 クラシック・シックテーマ ===== */
        :root {
            --bg-main: #F5F2EB;        /* 暖かいリネンベージュ */
            --bg-surface: #FFFFFF;     /* カード・モーダル白 */
            --bg-sub: #EDE8DF;         /* サブ背景（サンドベージュ） */
            --border-base: #DCD4C6;    /* 上品なグレージュ枠線 */
            --border-strong: #C4B9A5;
            --text-main: #2C2623;      /* チャコールブラウン */
            --text-sub: #6E655F;       /* ウォームグレー */
            --text-muted: #9E948B;
            --accent-dark: #3A322D;    /* エスプレッソ（主要ボタン） */
            --accent-bronze: #8C6D46;  /* アンティークブロンズ */
            --accent-sage: #4A6B5B;    /* セージグリーン（完了・稼働） */
            --male-bg: #F2F5F8;        /* 淡いスレートブルー */
            --male-border: #B8C7D9;
            --male-badge: #344E68;     /* 藍鉄（クラシカルネイビー） */
            --female-bg: #F9F3F3;      /* 淡いダスティローズ */
            --female-border: #DFC2C4;
            --female-badge: #7D4449;   /* ボルドー・くすみローズ */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
            letter-spacing: 0.02em;
        }

        .touch-none { touch-action: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #EDE8DF; }
        ::-webkit-scrollbar-thumb { background: #C4B9A5; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #A89B84; }

        @-webkit-keyframes pulse-terracotta {
            0%, 100% { border-color: rgba(168, 62, 50, 0.85); box-shadow: 0 4px 16px rgba(168, 62, 50, 0.18); }
            50% { border-color: rgba(168, 62, 50, 0.25); box-shadow: 0 2px 6px rgba(168, 62, 50, 0.06); }
        }
        @keyframes pulse-terracotta {
            0%, 100% { border-color: rgba(168, 62, 50, 0.85); box-shadow: 0 4px 16px rgba(168, 62, 50, 0.18); }
            50% { border-color: rgba(168, 62, 50, 0.25); box-shadow: 0 2px 6px rgba(168, 62, 50, 0.06); }
        }
        .urgency-danger { -webkit-animation: pulse-terracotta 2s infinite; animation: pulse-terracotta 2s infinite; }

        .bg-ticket-grid {
            background-color: #FAF8F5;
            background-size: 16px 16px;
            background-image:
                linear-gradient(to right, rgba(140, 109, 70, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(140, 109, 70, 0.08) 1px, transparent 1px);
        }

        /* ===== 古いSafari (CSS Grid 非対応) でも崩れないレイアウト ===== */
        .kds-grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -8px; }
        .kds-grid > * { width: calc(100% - 16px); margin: 8px; }
        @media (min-width: 768px)  { .kds-grid > * { width: calc(50% - 16px); } }
        @media (min-width: 1024px) { .kds-grid > * { width: calc(33.333% - 16px); } }
        @media (min-width: 1280px) { .kds-grid > * { width: calc(25% - 16px); } }

        /* 5列フロアマップグリッド (長崎店 6行×5列 配置用) */
        .floor-grid {
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-flex-wrap: wrap; flex-wrap: wrap;
            margin: -3px;
        }
        .floor-cell {
            width: calc(20% - 6px);
            margin: 3px;
        }
        .floor-empty {
            width: calc(20% - 6px);
            margin: 3px;
            height: 36px;
            border-radius: 8px;
            border: 1px dashed #DFD8CC;
            background-color: rgba(237, 232, 223, 0.35);
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-box-align: center; -webkit-align-items: center; align-items: center;
            -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
            color: #C4B9A5;
            font-size: 11px;
        }

        .two-col { display: -webkit-box; display: -webkit-flex; display: flex; }
        .two-col > * { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
        .two-col > * + * { margin-left: 12px; }

        /* flex の gap 非対応ブラウザ用 (iOS 14.0 以下) */
        .no-flexgap .flex.gap-1:not(.flex-col) > * + *   { margin-left: 0.25rem; }
        .no-flexgap .flex.gap-1\.5:not(.flex-col) > * + * { margin-left: 0.375rem; }
        .no-flexgap .flex.gap-2:not(.flex-col) > * + *   { margin-left: 0.5rem; }
        .no-flexgap .flex.gap-3:not(.flex-col) > * + *   { margin-left: 0.75rem; }
        .no-flexgap .flex-col.gap-2 > * + *, .no-flexgap .flex-col.gap-3 > * + * { margin-top: 0.5rem; }
        @media (min-width: 640px) {
            .no-flexgap .flex-col.sm\:flex-row.gap-2 > * + *, .no-flexgap .flex-col.sm\:flex-row.gap-3 > * + * { margin-top: 0; margin-left: 0.5rem; }
        }

        /* 卓エリア別の上品なカラープリセット */
        .tbl-area-a   { background-color: #F6F1EA; border-color: #C8B094; color: #5C4630; } /* A卓: ウォームキャメル */
        .tbl-area-b   { background-color: #EFF3F0; border-color: #A5BDB0; color: #365244; } /* B卓: セージグリーン */
        .tbl-area-s   { background-color: #F2F0F5; border-color: #B8B0C8; color: #4A405E; } /* S卓: モーヴグレー */
        .tbl-area-o   { background-color: #EFF3F6; border-color: #A6B8C7; color: #374B5E; } /* O卓: スレートブルー */
        .tbl-area-v   { background-color: #F7F1EB; border-color: #C49E6C; color: #6B4C24; } /* V卓(VIP): シャンパンゴールド */
        .tbl-area-sub { background-color: #F2EFE9; border-color: #C7C0B6; color: #57504A; } /* その他: ストーングレー */

        /* 選択時の強調（派手なネオンではなく、深い輪郭線と影で表現） */
        .selected-from {
            box-shadow: 0 0 0 2px #8C6D46, 0 2px 6px rgba(58, 50, 45, 0.18);
            border-color: #8C6D46 !important;
            background-color: #EFE6D8 !important;
            color: #2C2623 !important;
        }
        .selected-to {
            box-shadow: 0 0 0 2px #4A6B5B, 0 2px 6px rgba(42, 74, 58, 0.18);
            border-color: #4A6B5B !important;
            background-color: #E3EDE8 !important;
            color: #1F382C !important;
        }

        /* 起動エラー表示 */
        #bootError { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col h-screen overflow-hidden select-none">

    <!-- Header Navigation -->
    <header style="background-color: #FDFBF7; border-bottom: 1px solid #DCD4C6;" class="px-5 py-3 flex-none flex flex-wrap items-center justify-between shadow-sm z-20">
        <!-- Brand & Clock -->
        <div class="flex items-center space-x-3">
            <div style="background-color: #3A322D; color: #F5F2EB;" class="p-2 rounded-lg flex items-center justify-center shadow-sm">
                <i data-lucide="arrow-right-left" class="w-5 h-5"></i>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 style="color: #2C2623;" class="font-bold text-base sm:text-lg tracking-wider">卓移動 KDS</h1>
                    <span style="background-color: #EDE8DF; color: #5C4630; border: 1px solid #D5CBB8;" class="text-[11px] font-semibold px-2.5 py-0.5 rounded tracking-widest">NAGASAKI / 長崎</span>
                </div>
                <div class="flex items-center space-x-2 text-xs mt-0.5">
                    <span id="syncStatus" class="flex items-center text-stone-500 font-medium" title="端末間同期の状態">
                        <span id="syncDot" class="w-2 h-2 rounded-full bg-stone-400 mr-1.5"></span>
                        <span id="syncText">接続中…</span>
                    </span>
                    <span style="color: #C4B9A5;">•</span>
                    <span id="clock" style="color: #6E655F;" class="font-mono font-medium">00:00:00</span>
                </div>
            </div>
        </div>

        <!-- View Switcher Tabs -->
        <div style="background-color: #EDE8DF; border: 1px solid #DCD4C6;" class="flex items-center p-1 rounded-lg">
            <button onclick="switchMainTab('ACTIVE')" id="tabBtnActive" style="background-color: #3A322D; color: #FAF8F5;" class="px-4 py-1.5 rounded-md text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i>
                <span>移動待ち</span>
                <span id="activeBadge" style="background-color: #FAF8F5; color: #3A322D;" class="ml-1 text-[11px] px-1.5 py-0.2 rounded-full font-bold">0</span>
            </button>
            <button onclick="switchMainTab('COMPLETED')" id="tabBtnCompleted" style="background-color: transparent; color: #6E655F;" class="px-4 py-1.5 rounded-md text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                <span>完了履歴</span>
                <span id="completedBadge" style="background-color: #DCD4C6; color: #4A423D;" class="ml-1 text-[11px] px-1.5 py-0.2 rounded-full font-bold">0</span>
            </button>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center space-x-2">
            <button onclick="openTableMgmtModal()" style="background-color: #FFFFFF; border: 1px solid #DCD4C6; color: #4A423D;" class="px-3 py-2 hover:bg-stone-100 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-sm" title="卓の設定・追加・削除">
                <i data-lucide="palette" style="color: #8C6D46;" class="w-4 h-4"></i>
                <span class="hidden lg:inline">卓管理</span>
            </button>

            <button id="soundToggleBtn" onclick="toggleSound()" style="background-color: #FFFFFF; border: 1px solid #DCD4C6; color: #4A423D;" class="p-2 hover:bg-stone-100 rounded-lg transition-colors shadow-sm" title="通知音切替">
                <i data-lucide="volume-2" id="soundIcon" style="color: #4A6B5B;" class="w-4 h-4"></i>
            </button>

            <button onclick="openOrderModal()" style="background-color: #3A322D; color: #FAF8F5;" class="flex items-center space-x-1.5 px-4 py-2 hover:opacity-90 rounded-lg font-bold text-xs shadow-sm transition-all">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>移動オーダー発行</span>
            </button>
        </div>
    </header>

    <!-- 起動エラー -->
    <div id="bootError" class="bg-red-800 text-white text-xs px-4 py-2"></div>

    <!-- Main Content Container -->
    <main class="flex-1 p-5 overflow-y-auto relative" style="-webkit-overflow-scrolling: touch;">

        <!-- View 1: Active KDS Board -->
        <div id="viewActive" class="space-y-4">
            <div id="activeGrid" class="kds-grid pb-12">
                <!-- Active order cards -->
            </div>

            <!-- Empty Active State -->
            <div id="emptyActive" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-6 pointer-events-none">
                <div style="background-color: #FDFBF7; border: 1px solid #DCD4C6;" class="p-8 rounded-2xl max-w-sm flex flex-col items-center shadow-sm">
                    <div style="background-color: #EDE8DF; color: #4A6B5B;" class="p-3.5 rounded-xl mb-3">
                        <i data-lucide="check-check" class="w-8 h-8"></i>
                    </div>
                    <h3 style="color: #2C2623;" class="font-bold text-base mb-1">現在、移動待ちの伝票はありません</h3>
                    <p style="color: #6E655F;" class="text-xs leading-relaxed">右上の「移動オーダー発行」から新しい卓移動を登録できます。</p>
                </div>
            </div>
        </div>

        <!-- View 2: Completed Orders View -->
        <div id="viewCompleted" class="hidden space-y-4 max-w-5xl mx-auto pb-12">
            <div style="background-color: #FDFBF7; border: 1px solid #DCD4C6;" class="rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <div style="background-color: #EDE8DF; color: #4A6B5B;" class="p-2.5 rounded-lg">
                        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h2 style="color: #2C2623;" class="text-sm font-bold">移動完了履歴</h2>
                        <p style="color: #6E655F;" class="text-xs">完了数: <span id="completedTodayCount" style="color: #4A6B5B;" class="font-bold">0</span> 件</p>
                    </div>
                </div>

                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" style="color: #9E948B;" class="w-4 h-4 absolute left-3 top-2.5"></i>
                    <input type="text" id="completedSearchInput" oninput="renderCompletedOrders()" placeholder="卓番号やメモで検索..." style="background-color: #F5F2EB; border: 1px solid #DCD4C6; color: #2C2623;" class="w-full rounded-lg pl-9 pr-3 py-2 text-xs outline-none">
                </div>
            </div>

            <div id="completedList" class="space-y-2">
                <!-- Completed order items rendered here -->
            </div>

            <div id="emptyCompleted" style="color: #9E948B;" class="hidden text-center py-16">
                <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-60"></i>
                <p class="text-xs font-medium">完了した移動伝票の履歴はありません</p>
            </div>
        </div>
    </main>

    <!-- Table Management Modal -->
    <div id="tableMgmtModal" style="background-color: rgba(44, 38, 35, 0.45);" class="fixed inset-0 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div style="background-color: #FDFBF7; border: 1px solid #DCD4C6;" class="rounded-xl max-w-lg w-full p-5 space-y-4 shadow-xl">
            <div style="border-bottom: 1px solid #E5DEC9;" class="flex items-center justify-between pb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="palette" style="color: #8C6D46;" class="w-5 h-5"></i>
                    <h2 style="color: #2C2623;" class="font-bold text-base">卓管理（色分け・追加・削除）</h2>
                </div>
                <button onclick="closeTableMgmtModal()" style="color: #6E655F;" class="p-1 rounded-lg hover:bg-stone-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div>
                <label style="color: #6E655F;" class="block text-xs font-bold mb-1.5">新しい卓番号を追加</label>
                <div class="flex gap-2">
                    <input type="text" id="modalAddTableInput" placeholder="例: A2, V6" style="background-color: #FFFFFF; border: 1px solid #DCD4C6; color: #2C2623;" class="flex-1 rounded-lg px-3 py-2 text-xs outline-none">
                    <button type="button" onclick="handleAddTableFromMgmt()" style="background-color: #3A322D; color: #FAF8F5;" class="px-4 py-2 font-bold text-xs rounded-lg shadow-sm flex items-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i> 追加
                    </button>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label style="color: #6E655F;" class="block text-xs font-bold">登録済みの卓一覧</label>
                    <button type="button" onclick="resetDefaultTables()" style="color: #8C6D46;" class="text-[11px] underline font-medium">初期の24卓に戻す</button>
                </div>
                <div id="mgmtTablesGrid" style="background-color: #F5F2EB; border: 1px solid #DCD4C6; -webkit-overflow-scrolling: touch;" class="space-y-1.5 max-h-64 overflow-y-auto p-2 rounded-lg">
                </div>
            </div>

            <div style="border-top: 1px solid #E5DEC9;" class="pt-3 flex justify-end">
                <button onclick="closeTableMgmtModal()" style="background-color: #EDE8DF; color: #2C2623; border: 1px solid #DCD4C6;" class="px-5 py-2 rounded-lg text-xs font-bold">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- Transfer Order Entry Modal -->
    <div id="orderModal" style="background-color: rgba(44, 38, 35, 0.45);" class="fixed inset-0 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-50 hidden">
        <div style="background-color: #FDFBF7; border: 1px solid #DCD4C6;" class="rounded-xl max-w-xl w-full max-h-[95vh] flex flex-col shadow-xl overflow-hidden">

            <div style="background-color: #F5F2EB; border-bottom: 1px solid #DCD4C6;" class="px-5 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i data-lucide="arrow-right-left" style="color: #8C6D46;" class="w-4 h-4"></i>
                    <h2 style="color: #2C2623;" class="font-bold text-sm sm:text-base">卓移動オーダー発行</h2>
                </div>
                <button onclick="closeOrderModal()" style="color: #6E655F;" class="p-1 rounded-lg hover:bg-stone-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-3.5" style="-webkit-overflow-scrolling: touch;">

                <!-- 1. Gender Selector -->
                <div>
                    <label style="color: #4A423D;" class="block text-xs font-bold mb-1.5">
                        1. 移動対象を選択
                    </label>
                    <div class="two-col">
                        <button type="button" onclick="selectGender('男性')" id="genderBtnMale" class="py-2.5 px-3 rounded-lg border font-bold text-xs flex items-center justify-center gap-2 transition-all">
                            <span class="w-2.5 h-2.5 rounded-full" style="background-color: #344E68;"></span>
                            <span class="text-sm tracking-wide">男性 (MALE)</span>
                        </button>
                        <button type="button" onclick="selectGender('女性')" id="genderBtnFemale" class="py-2.5 px-3 rounded-lg border font-bold text-xs flex items-center justify-center gap-2 transition-all">
                            <span class="w-2.5 h-2.5 rounded-full" style="background-color: #7D4449;"></span>
                            <span class="text-sm tracking-wide">女性 (FEMALE)</span>
                        </button>
                    </div>
                </div>

                <!-- 2 & 3. From / To Table Floor Layout -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- From Table -->
                    <div style="background-color: #F5F2EB; border: 1px solid #DCD4C6;" class="p-2.5 rounded-lg">
                        <label class="block text-xs font-bold mb-2 flex items-center justify-between" style="color: #4A423D;">
                            <span>2. 移動元 (FROM)</span>
                            <span id="fromSelectedBadge" style="background-color: #EFE6D8; color: #5C4630; border: 1px solid #C8B094;" class="px-2 py-0.5 rounded font-mono text-xs font-bold">未選択</span>
                        </label>
                        <div id="fromTableButtons" class="floor-grid">
                        </div>
                    </div>

                    <!-- To Table -->
                    <div style="background-color: #F5F2EB; border: 1px solid #DCD4C6;" class="p-2.5 rounded-lg">
                        <label class="block text-xs font-bold mb-2 flex items-center justify-between" style="color: #4A423D;">
                            <span>3. 移動先 (TO)</span>
                            <span id="toSelectedBadge" style="background-color: #E3EDE8; color: #2D4F3E; border: 1px solid #A5BDB0;" class="px-2 py-0.5 rounded font-mono text-xs font-bold">未選択</span>
                        </label>
                        <div id="toTableButtons" class="floor-grid">
                        </div>
                    </div>
                </div>

                <!-- 4. Note -->
                <div style="border: 1px solid #DCD4C6; background-color: #FFFFFF;" class="rounded-lg overflow-hidden">
                    <div style="background-color: #F5F2EB; border-bottom: 1px solid #DCD4C6;" class="px-3 py-1.5 flex items-center justify-between">
                        <span style="color: #5C4630;" class="text-xs font-bold flex items-center gap-1.5">
                            <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 指示メモ（任意）
                        </span>
                        <div style="background-color: #EDE8DF; border: 1px solid #DCD4C6;" class="flex items-center p-0.5 rounded-md">
                            <button type="button" onclick="switchNoteMode('text')" id="noteTabBtnText" class="px-2.5 py-1 rounded text-xs font-bold transition-all flex items-center gap-1">
                                <i data-lucide="keyboard" class="w-3 h-3"></i> テキスト
                            </button>
                            <button type="button" onclick="switchNoteMode('canvas')" id="noteTabBtnCanvas" class="px-2.5 py-1 rounded text-xs font-bold transition-all flex items-center gap-1">
                                <i data-lucide="pen-tool" class="w-3 h-3"></i> 手書き
                            </button>
                        </div>
                    </div>

                    <div id="noteModeText" class="p-2.5">
                        <textarea id="textNoteInput" rows="2" placeholder="例: グラス・お荷物の移動をお願いします" style="background-color: #FAF8F5; border: 1px solid #DCD4C6; color: #2C2623;" class="w-full rounded-md p-2 text-xs outline-none resize-none"></textarea>
                    </div>

                    <div id="noteModeCanvas" class="hidden p-2.5 space-y-2">
                        <div style="background-color: #F5F2EB; border: 1px solid #DCD4C6;" class="flex items-center justify-between p-1.5 rounded-md">
                            <div class="flex items-center space-x-2 pl-1">
                                <button type="button" onclick="setModalPenColor('#2C2623')" class="modal-color-btn w-5 h-5 rounded-full ring-2 ring-stone-500 ring-offset-1" style="background-color: #2C2623;" data-color="#2C2623" title="チャコール"></button>
                                <button type="button" onclick="setModalPenColor('#8E3B3B')" class="modal-color-btn w-5 h-5 rounded-full" style="background-color: #8E3B3B;" data-color="#8E3B3B" title="ボルドー"></button>
                                <button type="button" onclick="setModalPenColor('#344E68')" class="modal-color-btn w-5 h-5 rounded-full" style="background-color: #344E68;" data-color="#344E68" title="ネイビー"></button>
                                <button type="button" onclick="setModalPenColor('#8C6D46')" class="modal-color-btn w-5 h-5 rounded-full" style="background-color: #8C6D46;" data-color="#8C6D46" title="ブロンズ"></button>
                            </div>
                            <div class="flex items-center space-x-1">
                                <button type="button" onclick="setModalTool('eraser')" id="modalEraserBtn" style="color: #6E655F;" class="p-1 rounded" title="消しゴム">
                                    <i data-lucide="eraser" class="w-4 h-4"></i>
                                </button>
                                <button type="button" onclick="clearModalCanvas()" style="color: #6E655F;" class="p-1 rounded" title="すべて消去">
                                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div style="border: 1px solid #DCD4C6;" class="h-24 rounded-md relative overflow-hidden bg-ticket-grid">
                            <canvas id="ticketCanvas" class="w-full h-full touch-none cursor-crosshair block"></canvas>
                        </div>
                    </div>
                </div>

            </div>

            <div style="background-color: #F5F2EB; border-top: 1px solid #DCD4C6;" class="px-5 py-3 flex items-center justify-end space-x-3">
                <button onclick="closeOrderModal()" style="background-color: #FFFFFF; border: 1px solid #DCD4C6; color: #4A423D;" class="px-4 py-2 rounded-lg text-xs font-bold transition-colors">
                    キャンセル
                </button>
                <button onclick="submitTransferOrder()" style="background-color: #3A322D; color: #FAF8F5;" class="flex-1 sm:flex-none px-6 py-2 rounded-lg text-xs sm:text-sm font-bold shadow-sm transition-all flex items-center justify-center gap-1.5">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    <span>移動指示を送信</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" style="background-color: #2C2623; color: #FAF8F5; border: 1px solid #5C5049;" class="fixed bottom-5 right-5 px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 text-xs transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <div style="background-color: rgba(255,255,255,0.12); color: #E2C799;" class="p-1.5 rounded-lg">
            <i data-lucide="bell" class="w-4 h-4"></i>
        </div>
        <div>
            <div id="toastTitle" class="font-bold">通知</div>
            <div id="toastMsg" style="color: #D5CBB8;" class="text-[11px]">メッセージ本文</div>
        </div>
    </div>

    <script>
        window.onerror = function (msg, src, line) {
            var el = document.getElementById('bootError');
            if (el) {
                el.style.display = 'block';
                el.textContent = 'エラー: ' + msg + ' (' + String(src || '').split('/').pop() + ':' + line + ')';
            }
        };
    </script>
    <script src="icons.js?v=1"></script>
    <script src="app.js?v=1"></script>
</body>
</html>
